<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PAC-MAN — 2 PAC-MAN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: linear-gradient(135deg, #581c87, #1e3a8a, #000);
    font-family: monospace;
    color: #fff;
  }
  h1 {
    font-size: clamp(34px, 9vw, 64px);
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ec4899, #a855f7, #06b6d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(255,0,255,.8), 0 0 40px rgba(0,255,255,.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
  p.tagline { color: #06b6d4; font-size: 14px; text-shadow: 0 0 10px rgba(0,255,255,.8); margin-bottom: 16px; }
  .hud { display: flex; gap: 36px; font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  .hud .score { color: #facc15; text-shadow: 0 0 10px rgba(255,255,0,.8); }
  .hud .lives { color: #ec4899; text-shadow: 0 0 10px rgba(255,0,255,.8); }
  .stage-wrap {
    position: relative;
    border: 4px solid #ff00ff;
    box-shadow: 0 0 30px rgba(255,0,255,.8), inset 0 0 30px rgba(0,255,255,.3);
    line-height: 0;
  }
  canvas { display: block; max-width: 100%; height: auto; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.85);
  }
  .overlay[hidden] { display: none; }
  .overlay .inner { text-align: center; padding: 20px; }
  .overlay h2 {
    font-size: clamp(28px, 7vw, 48px); margin-bottom: 14px;
    background: linear-gradient(90deg, #facc15, #ec4899);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 20px rgba(255,255,0,.8);
  }
  .overlay .final-score { font-size: 26px; color: #06b6d4; text-shadow: 0 0 10px rgba(0,255,255,.8); margin-bottom: 20px; }
  .btn {
    padding: 16px 32px;
    font-family: monospace; font-weight: 700; font-size: 20px;
    color: #fff; cursor: pointer; border: none; border-radius: 8px;
    background: linear-gradient(90deg, #ec4899, #06b6d4);
    box-shadow: 0 0 20px rgba(255,0,255,.8);
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.play-again { background: linear-gradient(90deg, #a855f7, #06b6d4); box-shadow: 0 0 20px rgba(138,43,226,.8); }
  .overlay .hint { margin-top: 14px; color: #06b6d4; font-size: 13px; }
  .foot { margin-top: 18px; text-align: center; color: #06b6d4; font-size: 13px; text-shadow: 0 0 5px rgba(0,255,255,.6); max-width: 420px; }
  .foot p + p { margin-top: 6px; }
</style>
</head>
<body>

  <h1>2 PAC-MAN</h1>
  <p class="tagline">◢◤ NEON ARCADE 80s EDITION ◢◤</p>

  <div class="hud">
    <div class="score">SCORE: <span id="score">0</span></div>
    <div class="lives">LIVES: <span id="lives">★★★</span></div>
  </div>

  <div class="stage-wrap">
    <canvas id="game" width="500" height="500"></canvas>

    <div class="overlay" id="startOverlay">
      <div class="inner">
        <button class="btn" id="startBtn">START GAME</button>
        <p class="hint">Use Arrow Keys or WASD to move</p>
      </div>
    </div>

    <div class="overlay" id="gameOverOverlay" hidden>
      <div class="inner">
        <h2 id="resultTitle">GAME OVER</h2>
        <p class="final-score">Final Score: <span id="finalScore">0</span></p>
        <button class="btn play-again" id="againBtn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <div class="foot">
    <p>← ↑ ↓ → or W A S D to move</p>
    <p>Eat all the dots and avoid the ghosts!</p>
  </div>

  <script>
  (function () {
    'use strict';

    var gridSize = 20, tileSize = 25;
    var canvasWidth = gridSize * tileSize, canvasHeight = gridSize * tileSize;
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    var scoreEl = document.getElementById('score');
    var livesEl = document.getElementById('lives');
    var startOverlay = document.getElementById('startOverlay');
    var gameOverOverlay = document.getElementById('gameOverOverlay');
    var resultTitle = document.getElementById('resultTitle');
    var finalScore = document.getElementById('finalScore');

    var state = null;
    var score, lives, gameOver, gameStarted;
    var keyHandler = null, loopTimer = null;

    function makeState() {
      var walls = [], dots = [];
      for (var y = 0; y < gridSize; y++) {
        for (var x = 0; x < gridSize; x++) {
          if (x === 0 || x === gridSize - 1 || y === 0 || y === gridSize - 1) {
            walls.push({ x: x, y: y });
          } else if ((x === 5 || x === 14) && y > 5 && y < 14) {
            walls.push({ x: x, y: y });
          } else if ((y === 5 || y === 14) && x > 5 && x < 14) {
            walls.push({ x: x, y: y });
          } else if (x === 10 && y === 10) {
            // ghost home — no dot
          } else if (Math.abs(x - 10) <= 1 && Math.abs(y - 10) <= 1) {
            // around ghost home — no dot
          } else {
            dots.push({ x: x, y: y, active: true });
          }
        }
      }
      return {
        pacman: { x: 1, y: 1, direction: { x: 0, y: 0 }, nextDirection: { x: 0, y: 0 }, mouthOpen: 0 },
        ghosts: [
          { x: 9, y: 9, color: '#FF00FF', direction: { x: 1, y: 0 } },
          { x: 10, y: 9, color: '#00FFFF', direction: { x: -1, y: 0 } },
          { x: 9, y: 10, color: '#FF0080', direction: { x: 0, y: 1 } },
          { x: 10, y: 10, color: '#FFFF00', direction: { x: 0, y: -1 } }
        ],
        dots: dots,
        walls: walls
      };
    }

    function isWall(x, y) {
      return state.walls.some(function (w) { return w.x === x && w.y === y; });
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // Grid effect
      ctx.strokeStyle = '#1a1a3a';
      ctx.lineWidth = 1;
      for (var i = 0; i <= gridSize; i++) {
        ctx.beginPath(); ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, canvasHeight); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * tileSize); ctx.lineTo(canvasWidth, i * tileSize); ctx.stroke();
      }

      // Walls with neon glow
      ctx.shadowBlur = 15; ctx.shadowColor = '#00FFFF'; ctx.fillStyle = '#00FFFF';
      state.walls.forEach(function (wall) {
        ctx.fillRect(wall.x * tileSize + 2, wall.y * tileSize + 2, tileSize - 4, tileSize - 4);
      });

      // Dots with glow
      ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 10; ctx.fillStyle = '#FFD700';
      state.dots.forEach(function (dot) {
        if (dot.active) {
          ctx.beginPath();
          ctx.arc(dot.x * tileSize + tileSize / 2, dot.y * tileSize + tileSize / 2, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Pac-Man
      ctx.shadowColor = '#FFFF00'; ctx.shadowBlur = 20; ctx.fillStyle = '#FFFF00';
      var px = state.pacman.x * tileSize + tileSize / 2;
      var py = state.pacman.y * tileSize + tileSize / 2;
      var radius = tileSize / 2 - 4;
      var angle = 0;
      if (state.pacman.direction.x === 1) angle = 0;
      else if (state.pacman.direction.x === -1) angle = Math.PI;
      else if (state.pacman.direction.y === -1) angle = -Math.PI / 2;
      else if (state.pacman.direction.y === 1) angle = Math.PI / 2;
      var mouthAngle = state.pacman.mouthOpen * 0.5 + 0.2;
      ctx.beginPath();
      ctx.arc(px, py, radius, angle + mouthAngle, angle + (Math.PI * 2 - mouthAngle));
      ctx.lineTo(px, py);
      ctx.fill();

      // Ghosts
      state.ghosts.forEach(function (ghost) {
        ctx.shadowColor = ghost.color; ctx.shadowBlur = 20; ctx.fillStyle = ghost.color;
        var gx = ghost.x * tileSize + tileSize / 2;
        var gy = ghost.y * tileSize + tileSize / 2;
        ctx.beginPath();
        ctx.arc(gx, gy - 3, radius - 2, Math.PI, 0);
        ctx.lineTo(gx + radius - 2, gy + radius - 2);
        ctx.lineTo(gx + radius / 2, gy + radius / 2 - 2);
        ctx.lineTo(gx, gy + radius - 2);
        ctx.lineTo(gx - radius / 2, gy + radius / 2 - 2);
        ctx.lineTo(gx - radius + 2, gy + radius - 2);
        ctx.closePath();
        ctx.fill();
        // Eyes
        ctx.shadowBlur = 5; ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(gx - 4, gy - 4, 3, 0, Math.PI * 2); ctx.arc(gx + 4, gy - 4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(gx - 3, gy - 4, 2, 0, Math.PI * 2); ctx.arc(gx + 5, gy - 4, 2, 0, Math.PI * 2); ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function updateHud() {
      scoreEl.textContent = String(score);
      var stars = '';
      for (var i = 0; i < lives; i++) stars += '★';
      livesEl.textContent = stars;
    }

    function gameLoop() {
      // Try to change direction
      var nextPos = {
        x: state.pacman.x + state.pacman.nextDirection.x,
        y: state.pacman.y + state.pacman.nextDirection.y
      };
      if (!isWall(nextPos.x, nextPos.y)) {
        state.pacman.direction = { x: state.pacman.nextDirection.x, y: state.pacman.nextDirection.y };
      }

      // Move Pac-Man
      var newPac = { x: state.pacman.x + state.pacman.direction.x, y: state.pacman.y + state.pacman.direction.y };
      if (!isWall(newPac.x, newPac.y)) {
        state.pacman.x = newPac.x;
        state.pacman.y = newPac.y;
        state.pacman.mouthOpen = (state.pacman.mouthOpen + 0.2) % 1;
      }

      // Dot collision
      for (var di = 0; di < state.dots.length; di++) {
        if (state.dots[di].active && state.dots[di].x === state.pacman.x && state.dots[di].y === state.pacman.y) {
          state.dots[di].active = false;
          score += 10;
          updateHud();
          break;
        }
      }

      // Move ghosts
      state.ghosts.forEach(function (ghost) {
        var possibleDirs = [
          { x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }
        ].filter(function (dir) {
          var np = { x: ghost.x + dir.x, y: ghost.y + dir.y };
          return !isWall(np.x, np.y);
        });
        if (Math.random() < 0.2 && possibleDirs.length > 0) {
          ghost.direction = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
        }
        var ng = { x: ghost.x + ghost.direction.x, y: ghost.y + ghost.direction.y };
        if (!isWall(ng.x, ng.y)) {
          ghost.x = ng.x; ghost.y = ng.y;
        }
      });

      // Ghost collision
      var hit = state.ghosts.some(function (g) { return g.x === state.pacman.x && g.y === state.pacman.y; });
      if (hit) {
        lives -= 1;
        if (lives <= 0) {
          endGame(false);
          return;
        } else {
          state.pacman.x = 1; state.pacman.y = 1;
          state.pacman.direction = { x: 0, y: 0 };
          state.pacman.nextDirection = { x: 0, y: 0 };
        }
        updateHud();
      }

      // Win check
      var allEaten = state.dots.every(function (d) { return !d.active; });
      if (allEaten) {
        endGame(true);
        return;
      }

      draw();
    }

    function endGame(win) {
      gameOver = true;
      clearInterval(loopTimer);
      loopTimer = null;
      window.removeEventListener('keydown', keyHandler);
      resultTitle.textContent = win ? 'YOU WIN!' : 'GAME OVER';
      finalScore.textContent = String(score);
      gameOverOverlay.hidden = false;
    }

    function startGame() {
      state = makeState();
      score = 0;
      lives = 3;
      gameOver = false;
      gameStarted = true;
      updateHud();
      draw();

      startOverlay.hidden = true;
      gameOverOverlay.hidden = true;

      if (keyHandler) window.removeEventListener('keydown', keyHandler);
      keyHandler = function (e) {
        var directions = {
          'ArrowUp': { x: 0, y: -1 }, 'ArrowDown': { x: 0, y: 1 },
          'ArrowLeft': { x: -1, y: 0 }, 'ArrowRight': { x: 1, y: 0 },
          'w': { x: 0, y: -1 }, 's': { x: 0, y: 1 },
          'a': { x: -1, y: 0 }, 'd': { x: 1, y: 0 }
        };
        if (directions[e.key]) { e.preventDefault(); state.pacman.nextDirection = directions[e.key]; }
      };
      window.addEventListener('keydown', keyHandler);

      if (loopTimer) clearInterval(loopTimer);
      loopTimer = setInterval(gameLoop, 150);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('againBtn').addEventListener('click', startGame);
  })();
  </script>
</body>
</html>
